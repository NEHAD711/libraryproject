{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>HTML5 Links</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>

    <div class="link-block-green">
        <a href="https://www.qu.edu.qa" target="_blank" class="link-green">Go to QU website (open a new tab)</a>
    </div>

    <div class="link-block-gray">
        <a href="https://www.qu.edu.qa" target="_self" class="link-yellow">Go to QU website (open in the same page/tab)</a>
    </div>

    <div class="link-block-black">
        <a href="https://www.qu.edu.qa" target="_self" class="link-yellow">Go to QU website (open in the same page/tab)</a>
    </div>

</body>
</html>
