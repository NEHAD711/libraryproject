<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>List Books - Lab 10 Part 1</title>
</head>
<body>
    <h1>Book List (Part 1)</h1>
    <a href="{% url 'books:lab10_part1_addbook' %}">Add New Book</a>
    <br><br>
    <table border="1" cellpadding="10">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Authors</th>
            <th>Price</th>
            <th>Edition</th>
            <th>Actions</th>
        </tr>
        {% for book in books %}
        <tr>
            <td>{{ book.id }}</td>
            <td>{{ book.title }}</td>
            <td>{{ book.author }}</td>
            <td>{{ book.price }}</td>
            <td>{{ book.edition }}</td>
            <td>
                <a href="{% url 'books:lab10_part1_editbook' book.id %}">Edit</a> | 
                <a href="{% url 'books:lab10_part1_deletebook' book.id %}">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="6">No books available.</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
