<!DOCTYPE html>
<html>
<head>
    <title>Lab 13 - Task 1</title>
</head>
<body>
    <div id="myDiv" style="width: 200px; height: 100px; background-color: lightgray; margin-bottom: 10px;">
        Original Text
    </div>
    <button id="btn1">Change Color</button>
    <button id="btn2">Change Text</button>

    <script>
        document.getElementById("btn1").addEventListener("click", function() {
            document.getElementById("myDiv").style.backgroundColor = "lightblue";
        });
        document.getElementById("btn2").addEventListener("click", function() {
            document.getElementById("myDiv").innerHTML = "Text Changed!";
        });
    </script>
</body>
</html>
