<!DOCTYPE html>
<html>
<head>
    <title>Lab 8 - Task 1</title>
</head>
<body>
    <h1>Books with Price <= 80 (Q Operator)</h1>
    <ul>
        {% for book in books %}
            <li>ID: {{ book.id }} | Title: {{ book.title }} | Price: {{ book.price }}</li>
        {% empty %}
            <li>No books found.</li>
        {% endfor %}
    </ul>
</body>
</html>
